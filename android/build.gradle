plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shiyue.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shiyue.app"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0-Native"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 100% Pure Native Framework implementation (Zero bloated dependencies)
}
